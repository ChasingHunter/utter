<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <style>
      :root {
        --ink: #0c0c0e;
        --line: rgba(255, 255, 255, 0.1);
        --fg: #f5f5f4;
        --muted: #a1a1aa;
        --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font: 500 13px/1.35 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
        color: var(--fg);
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 8px;
        gap: 8px;
      }

      /* The capsule: black, hairline border, soft shadow. */
      #pill {
        height: 34px;
        min-width: 44px;
        padding: 0 14px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 17px;
        background: var(--ink);
        border: 1px solid var(--line);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transform: translateY(8px) scale(0.9);
        transition: opacity 160ms var(--ease), transform 220ms var(--ease);
      }
      #pill.on {
        opacity: 1;
        transform: none;
      }
      #wave {
        width: 108px;
        height: 22px;
        display: block;
      }
      #pill.text #wave {
        display: none;
      }
      #msg {
        display: none;
        white-space: nowrap;
      }
      #pill.text #msg {
        display: block;
      }
      #pill.text::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
      }
      #pill.text.error::before {
        background: #f87171;
      }

      /* The copy card: shows up above the capsule when there was nowhere to paste. */
      #card {
        width: 340px;
        box-sizing: border-box;
        padding: 12px 12px 10px 14px;
        border-radius: 16px;
        background: var(--ink);
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        display: none;
        opacity: 0;
        transform: translateY(8px) scale(0.96);
        transition: opacity 160ms var(--ease), transform 220ms var(--ease);
      }
      #card.shown {
        display: block;
      }
      #card.on {
        opacity: 1;
        transform: none;
      }
      #note {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }
      #text {
        font-weight: 400;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        user-select: text;
      }
      #row {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: var(--fg);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      #copy {
        background: var(--fg);
        color: var(--ink);
        border-color: transparent;
      }
      #copy:hover {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="card">
        <div id="note"></div>
        <div id="text"></div>
        <div id="row">
          <button id="close">Dismiss</button>
          <button id="copy">Copy</button>
        </div>
      </div>
      <div id="pill">
        <canvas id="wave"></canvas>
        <div id="msg"></div>
      </div>
    </div>
    <script src="./pill.js"></script>
  </body>
</html>
