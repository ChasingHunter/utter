<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font: 500 13px/1 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
      }
      #pill {
        box-sizing: border-box;
        height: 40px;
        margin: 4px;
        padding: 0 16px 0 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 20px;
        background: rgba(24, 24, 27, 0.92);
        color: #f4f4f5;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      #dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ef4444;
        flex: none;
      }
      #pill.busy #dot {
        background: #f59e0b;
        animation: pulse 0.9s ease-in-out infinite;
      }
      #pill.error #dot,
      #pill.opening #dot {
        background: #71717a;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      #bars {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 20px;
      }
      #bars span {
        width: 3px;
        height: 3px;
        border-radius: 2px;
        background: #f4f4f5;
        transition: height 60ms linear;
      }
      #pill:not(.recording) #bars {
        display: none;
      }
      #time {
        color: #a1a1aa;
        font-variant-numeric: tabular-nums;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div id="pill">
      <div id="dot"></div>
      <div id="bars"></div>
      <div id="label"></div>
      <div id="time"></div>
    </div>
    <script src="./pill.js"></script>
  </body>
</html>
